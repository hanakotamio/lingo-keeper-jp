# Alert Policies for Lingo Keeper JP
# Deploy these using: gcloud alpha monitoring policies create --policy-from-file=<file>

---
# High Error Rate Alert
displayName: "High Error Rate (5xx)"
documentation:
  content: |
    The service is experiencing a high rate of 5xx errors (> 5% of requests).

    **Steps to investigate:**
    1. Check Cloud Run logs for error details
    2. Review recent deployments
    3. Check database connectivity
    4. Verify external API availability (OpenAI, Google TTS)

    **Dashboard:** Lingo Keeper JP - Cloud Run Monitoring
  mimeType: text/markdown
conditions:
  - displayName: "5xx Error Rate > 5%"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "lingo-keeper-jp-backend"
        AND metric.type = "run.googleapis.com/request_count"
        AND metric.labels.response_code_class = "5xx"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0.05  # 5% error rate
      duration: 300s  # 5 minutes
      trigger:
        count: 1
alertStrategy:
  autoClose: 1800s  # 30 minutes
notificationChannels:
  # Add your notification channel IDs here
  # - projects/[PROJECT_ID]/notificationChannels/[CHANNEL_ID]
enabled: true
combiner: OR

---
# High Latency Alert
displayName: "High Request Latency (P95 > 1s)"
documentation:
  content: |
    Request latency (P95) has exceeded 1 second.

    **Steps to investigate:**
    1. Check CPU and memory utilization
    2. Review database query performance
    3. Check for slow external API calls
    4. Review recent code changes
    5. Consider scaling up resources

    **Dashboard:** Lingo Keeper JP - Cloud Run Monitoring
  mimeType: text/markdown
conditions:
  - displayName: "P95 Latency > 1000ms"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "lingo-keeper-jp-backend"
        AND metric.type = "run.googleapis.com/request_latencies"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_DELTA
          crossSeriesReducer: REDUCE_PERCENTILE_95
      comparison: COMPARISON_GT
      thresholdValue: 1000  # 1000ms = 1s
      duration: 300s  # 5 minutes
      trigger:
        count: 1
alertStrategy:
  autoClose: 1800s
notificationChannels: []
enabled: true
combiner: OR

---
# High CPU Utilization Alert
displayName: "High CPU Utilization (> 90%)"
documentation:
  content: |
    CPU utilization has exceeded 90% for an extended period.

    **Steps to investigate:**
    1. Check for CPU-intensive operations in logs
    2. Review request volume and patterns
    3. Consider increasing CPU allocation
    4. Check for infinite loops or inefficient code

    **Dashboard:** Lingo Keeper JP - Cloud Run Monitoring
  mimeType: text/markdown
conditions:
  - displayName: "CPU > 90%"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "lingo-keeper-jp-backend"
        AND metric.type = "run.googleapis.com/container/cpu/utilizations"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_MEAN
          crossSeriesReducer: REDUCE_MEAN
      comparison: COMPARISON_GT
      thresholdValue: 0.9  # 90%
      duration: 600s  # 10 minutes
      trigger:
        count: 1
alertStrategy:
  autoClose: 1800s
notificationChannels: []
enabled: true
combiner: OR

