---
# Database Connection Failure Alert
displayName: "Database Connection Failures"
documentation:
  content: |
    The application is unable to connect to the database.

    **Steps to investigate:**
    1. Check Neon database status
    2. Verify DATABASE_URL secret is correct
    3. Check network connectivity
    4. Review Neon connection limits
    5. Check for database maintenance windows

    **Dashboard:** Lingo Keeper JP - Application Metrics
  mimeType: text/markdown
conditions:
  - displayName: "Health Check Failures"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "lingo-keeper-jp-backend"
        AND metric.type = "run.googleapis.com/request_count"
        AND resource.labels.route = "/api/health"
        AND metric.labels.response_code = "503"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0.1  # > 0.1 failures per second
      duration: 120s  # 2 minutes
      trigger:
        count: 1
alertStrategy:
  autoClose: 1800s
notificationChannels: []
enabled: true
combiner: OR

---
# Deployment Failure Alert
displayName: "Cloud Run Deployment Failure"
documentation:
  content: |
    A deployment to Cloud Run has failed.

    **Steps to investigate:**
    1. Check Cloud Build logs
    2. Verify Dockerfile configuration
    3. Check container image build
    4. Review environment variables and secrets
    5. Check service account permissions

    **Dashboard:** Cloud Build History
  mimeType: text/markdown
conditions:
  - displayName: "Deployment Failed"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND metric.type = "run.googleapis.com/container/startup_latencies"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_MAX
          crossSeriesReducer: REDUCE_MAX
      comparison: COMPARISON_GT
      thresholdValue: 300000  # 5 minutes startup time indicates failure
      duration: 60s
      trigger:
        count: 1
alertStrategy:
  autoClose: 3600s  # 1 hour
notificationChannels: []
enabled: true
combiner: OR

---
# Low Availability Alert (SLO-based)
displayName: "Low Availability (< 99.5%)"
documentation:
  content: |
    Service availability has dropped below the SLO threshold of 99.5%.

    **Steps to investigate:**
    1. Review error logs for patterns
    2. Check infrastructure health
    3. Verify all dependencies are operational
    4. Review recent changes and deployments

    **Dashboard:** Lingo Keeper JP - Application Metrics
  mimeType: text/markdown
conditions:
  - displayName: "Availability < 99.5%"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "lingo-keeper-jp-backend"
        AND metric.type = "run.googleapis.com/request_count"
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
          groupByFields:
            - metric.label.response_code_class
      denominatorFilter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "lingo-keeper-jp-backend"
        AND metric.type = "run.googleapis.com/request_count"
      denominatorAggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_LT
      thresholdValue: 0.995  # 99.5% availability
      duration: 900s  # 15 minutes
      trigger:
        count: 1
alertStrategy:
  autoClose: 1800s
notificationChannels: []
enabled: true
combiner: OR
