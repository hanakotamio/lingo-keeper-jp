      #             "text": {
      #               "type": "mrkdwn",
      #               "text": "*Neon PostgreSQL Backup Failed*\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\n• Status: ❌ Failed\n• Action Required: Check workflow logs"
      #             }
      #           }
      #         ]
      #       }

  # Optional: Test restore job (runs monthly)
  test-restore:
    name: Monthly Backup Restore Test
    runs-on: ubuntu-latest
    needs: backup
    # Only run on the last day of the month
    if: github.event.schedule == '0 3 28-31 * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Download backup artifact
        uses: actions/download-artifact@v4
        with:
          pattern: backup-*
          merge-multiple: false

      - name: Find latest backup
        id: find_backup
        run: |
          LATEST_BACKUP=$(ls -t backup-*.dump | head -1)
          echo "latest_backup=${LATEST_BACKUP}" >> $GITHUB_OUTPUT
          echo "Found latest backup: ${LATEST_BACKUP}"

      - name: Verify backup can be listed
        run: |
          echo "Testing backup restore capability..."

          # List contents without actually restoring
          pg_restore --list "${{ steps.find_backup.outputs.latest_backup }}" > restore-test.txt

          # Count objects
          OBJECT_COUNT=$(wc -l < restore-test.txt)
          echo "Backup contains ${OBJECT_COUNT} objects"

          # Display first 20 lines
          echo "First 20 objects in backup:"
          head -20 restore-test.txt

          if [ $OBJECT_COUNT -gt 0 ]; then
            echo "✅ Restore test successful - backup is valid"
          else
            echo "❌ Restore test failed - backup appears empty"
            exit 1
          fi

      - name: Upload restore test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-test-results-$(date +%Y%m%d)
          path: restore-test.txt
          retention-days: 30

      # Optional: For full restore testing, you would create a temporary Neon branch
      # and restore to it, but this requires API key and more setup
